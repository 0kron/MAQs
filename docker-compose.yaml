services:
  go2_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: go2_ros2_humble
    container_name: go2_dev
    hostname: go2_dev
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/run/user/1000
      - QT_QPA_PLATFORM=xcb
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${HOME}/MAQs/maq-volume:/workspace/maq-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}:/tmp/${WAYLAND_DISPLAY}
    working_dir: /workspace/maq-volume
    command: zsh
